replicaCount: 2
image:
  repository: rhys561d/go-web
  tag: v1
  pullPolicy: IfNotPresent
service:
  port: 80
containerPort: 8080
ingress:
  enabled: true
  className: traefik
  host: go-web-helm.local
  path: /
  tls: []
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 64Mi
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5

# The application listens on 8080; service.port can be changed independently.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
test:
  enabled: true
  image: busybox:1.37.0

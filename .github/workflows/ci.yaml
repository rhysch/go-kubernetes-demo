name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test -race -v ./...
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: rhys561d/go-web:${{ github.sha }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: [self-hosted, linux, x64, go-vm]
    timeout-minutes: 10
    env:
      IMAGE: rhys561d/go-web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare manifest
        run: |
          sed -E "s|^([[:space:]]*)image:.*|\1image: $IMAGE|" \
            k8s/deployment.yaml > "$RUNNER_TEMP/go-web-deployment.yaml"
      - name: Apply resources
        run: |
          sudo -n k3s kubectl apply -f k8s/namespace.yaml
          sudo -n k3s kubectl apply -f "$RUNNER_TEMP/go-web-deployment.yaml"
          sudo -n k3s kubectl apply -f k8s/service.yaml
          sudo -n k3s kubectl apply -f k8s/ingress-vm.yaml
      - name: Verify rollout and Ingress
        run: |
          sudo -n k3s kubectl rollout status deployment/go-web -n go-cicd --timeout=180s
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 5 --max-time 10 \
            -H 'Host: go-web.13.201.98.93.sslip.io' http://127.0.0.1/healthz
      - name: Diagnostics
        if: failure()
        run: |
          sudo -n k3s kubectl get pods -n go-cicd
          sudo -n k3s kubectl get events -n go-cicd --sort-by=.metadata.creationTimestamp
          sudo -n k3s kubectl logs deployment/go-web -n go-cicd --all-containers --tail=50 || true
